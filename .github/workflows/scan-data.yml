name: Build scan data

# Makes the small "fingerprint" files the app's scanner uses, so your phone
# never has to download every card image. Runs once a month to pick up new
# sets, and can be started by hand from the Actions tab.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 * *'
  push:
    branches: [main, master]
    paths:
      - 'build/make_scan_data.py'
      - 'www/js/fp.js'

permissions:
  contents: write

concurrency:
  group: scan-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Build fingerprints
        env:
          MAX_MINUTES: '300'
        run: python build/make_scan_data.py

      - name: Save to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update scan data"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

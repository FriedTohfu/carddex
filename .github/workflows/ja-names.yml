name: Add Japanese card names

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['build/add_ja_names.py']

permissions:
  contents: write

jobs:
  names:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Japanese names (TCGdex)
        run: python build/add_ja_names.py 2>&1 | tee data/ja-names-log.txt
      - name: Save
        if: always()
        run: bash build/save-data.sh "Add Japanese card names (TCGdex)"

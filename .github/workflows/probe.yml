name: Probe
on:
  push:
    branches: [probe]
    paths: [probe/probe5.py, .github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo skip
      - run: cd probe && python3 probe5.py
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add probe/out5 && git commit -m "probe output 5" && git push

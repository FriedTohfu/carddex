name: Probe
on:
  push:
    branches: [probe]
    paths: [probe/probe2.py, .github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: cd probe && xvfb-run -a python3 probe2.py
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add probe/out2 && git commit -m "probe output 2" && git push

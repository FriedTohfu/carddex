name: Probe
on:
  push:
    branches: [probe]
    paths: [probe/probe.py, .github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd probe && python3 probe.py
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add probe/out && git commit -m "probe output" && git push

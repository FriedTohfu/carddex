name: Check card pictures

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-images.yml']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Burst of picture requests (like opening a screen of cards)
        run: |
          LOG=data/probe-log.txt; : > $LOG
          UA='Mozilla/5.0 (Linux; Android 14; SM-S911B; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/129.0 Mobile Safari/537.36'
          i=0
          while read -r P; do
            i=$((i+1))
            echo "https://img.dextcg.com/w=256/https://$P" 
          done < data/burst-urls.txt > /tmp/urls
          # 6 at a time, like the app
          head -3 /tmp/urls | xargs -P 6 -I{} curl -s -o /dev/null -w '%{http_code} %{time_total}s %{content_type}\n' -A "$UA" -H 'Referer: https://localhost/' {} | sort | uniq -c | sort -rn >> $LOG
          echo "--- after burst, one more:" >> $LOG
          curl -s -D - -o /dev/null -A "$UA" -H 'Referer: https://localhost/' "$(head -1 /tmp/urls)" | head -15 >> $LOG
          echo "--- weserv fallback:" >> $LOG
          curl -s -o /dev/null -w '%{http_code} %{content_type} %{size_download}\n' "https://images.weserv.nl/?url=static.dextcg.com%2Fcards%2Fme4%252F1.png&w=256&output=webp&q=82" >> $LOG
          curl -s -o /dev/null -w '%{http_code} %{content_type} %{size_download}\n' "https://images.weserv.nl/?url=static.dextcg.com%2Fcards%2Fswsh9tg%252FTG23.png&w=256&output=webp&q=82" >> $LOG
          cat $LOG
      - name: Save
        if: always()
        run: bash build/save-data.sh "Card picture check"
